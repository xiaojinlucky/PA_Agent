name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify install
        run: python -c "import pa_agent; print('OK')"

      - name: Capture commit and Python environment
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scratch/ci-evidence | Out-Null
          $captureErrors = @()
          $gitSha = (git rev-parse HEAD 2>&1 | Out-String).Trim()
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0 -or $gitSha -notmatch "^[0-9a-f]{40}$") {
            "unavailable: git rev-parse HEAD failed" |
              Set-Content -Encoding utf8 scratch/ci-evidence/full-git-sha.txt
            $captureErrors += "git_sha"
          } else {
            $gitSha |
              Set-Content -Encoding utf8 scratch/ci-evidence/full-git-sha.txt
          }
          $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
          if ($null -eq $pythonCommand) {
            "unavailable: python command not found" |
              Set-Content -Encoding utf8 scratch/ci-evidence/python-version.txt
            "unavailable: python command not found" |
              Set-Content -Encoding utf8 scratch/ci-evidence/pip-freeze.txt
            $captureErrors += "python_command"
          } else {
            $pythonVersion = (python --version 2>&1 | Out-String).Trim()
            $pythonExitCode = $LASTEXITCODE
            if ($pythonExitCode -ne 0) {
              "unavailable: python --version failed" |
                Set-Content -Encoding utf8 scratch/ci-evidence/python-version.txt
              "unavailable: python --version failed" |
                Set-Content -Encoding utf8 scratch/ci-evidence/pip-freeze.txt
              $captureErrors += "python_version"
            } else {
              $pythonVersion |
                Set-Content -Encoding utf8 scratch/ci-evidence/python-version.txt
              $packageVersion = (
                python -c "import pa_agent; print(pa_agent.__version__)" 2>&1 |
                  Out-String
              ).Trim()
              $packageVersionExitCode = $LASTEXITCODE
              $pipFreeze = @(python -m pip freeze --exclude-editable 2>&1)
              $pipExitCode = $LASTEXITCODE
              if (
                $packageVersionExitCode -ne 0 -or
                $pipExitCode -ne 0
              ) {
                "unavailable: pip freeze failed" |
                  Set-Content -Encoding utf8 scratch/ci-evidence/pip-freeze.txt
                $captureErrors += "pip_freeze"
              } else {
                $sanitizedFreeze = @("pa-agent==$packageVersion") + $pipFreeze
                $sanitizedFreeze |
                  Set-Content -Encoding utf8 scratch/ci-evidence/pip-freeze.txt
              }
            }
          }
          if ($captureErrors.Count -ne 0) {
            throw "CI environment capture failed: $($captureErrors -join ', ')"
          }

      - name: Run deterministic test suite
        run: >-
          python -m pytest -p no:cacheprovider -m "not live"
          --junitxml=scratch/ci-evidence/pytest-deterministic-junit.xml

      - name: Enforce deterministic test and skip budget
        if: always()
        shell: pwsh
        run: |
          $report = [xml](Get-Content -Raw scratch/ci-evidence/pytest-deterministic-junit.xml)
          $suite = $report.testsuites.testsuite
          $tests = [int]$suite.tests
          $failures = [int]$suite.failures
          $errors = [int]$suite.errors
          $skipped = [int]$suite.skipped
          if ($tests -lt 2265 -or $failures -ne 0 -or $errors -ne 0 -or $skipped -gt 3) {
            throw "pytest gate failed: tests=$tests failures=$failures errors=$errors skipped=$skipped"
          }

      - name: Run live provider health checks
        id: live_provider
        if: always()
        continue-on-error: true
        run: >-
          python -m pytest -p no:cacheprovider -m live
          --junitxml=scratch/ci-evidence/pytest-live-provider-junit.xml

      - name: Record live provider outcome
        if: always()
        shell: pwsh
        run: |
          $outcome = "${{ steps.live_provider.outcome }}"
          "step_outcome=$outcome" | Set-Content -Encoding utf8 scratch/ci-evidence/live-provider-outcome.txt
          $reportPath = "scratch/ci-evidence/pytest-live-provider-junit.xml"
          $healthStatus = "missing"
          if (Test-Path $reportPath) {
            try {
              $report = [xml](Get-Content -Raw $reportPath)
              $suite = $report.testsuites.testsuite
              $tests = [int]$suite.tests
              $failures = [int]$suite.failures
              $errors = [int]$suite.errors
              $skipped = [int]$suite.skipped
              if ($failures -ne 0 -or $errors -ne 0) {
                $healthStatus = "unhealthy"
              } elseif ($tests -eq $skipped) {
                $healthStatus = "unavailable"
              } elseif ($skipped -ne 0) {
                $healthStatus = "partial"
              } else {
                $healthStatus = "healthy"
              }
              "tests=$tests failures=$failures errors=$errors skipped=$skipped" |
                Add-Content -Encoding utf8 scratch/ci-evidence/live-provider-outcome.txt
            } catch {
              $healthStatus = "invalid"
              "junit_status=invalid" |
                Add-Content -Encoding utf8 scratch/ci-evidence/live-provider-outcome.txt
            }
          }
          "health_status=$healthStatus" |
            Add-Content -Encoding utf8 scratch/ci-evidence/live-provider-outcome.txt
          if ($outcome -ne "success" -or $healthStatus -ne "healthy") {
            "Live provider health status: $healthStatus; inspect the uploaded JUnit evidence." |
              Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Redact and validate CI evidence
        id: evidence_guard
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release_pipeline.py sanitize-junit `
            scratch/ci-evidence/pytest-deterministic-junit.xml
          python scripts/release_pipeline.py sanitize-junit `
            scratch/ci-evidence/pytest-live-provider-junit.xml
          python scripts/release_pipeline.py scan-tree scratch/ci-evidence `
            --reject-private-paths

      - name: Verify CI evidence files
        id: evidence_files
        if: always()
        shell: pwsh
        run: |
          $required = @(
            "scratch/ci-evidence/pytest-deterministic-junit.xml",
            "scratch/ci-evidence/live-provider-outcome.txt",
            "scratch/ci-evidence/full-git-sha.txt",
            "scratch/ci-evidence/python-version.txt",
            "scratch/ci-evidence/pip-freeze.txt"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "CI evidence missing: $($missing -join ', ')"
          }

      - name: Upload test and environment evidence
        if: >-
          always() &&
          steps.evidence_guard.outcome == 'success' &&
          steps.evidence_files.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            scratch/ci-evidence/pytest-deterministic-junit.xml
            scratch/ci-evidence/pytest-live-provider-junit.xml
            scratch/ci-evidence/live-provider-outcome.txt
            scratch/ci-evidence/full-git-sha.txt
            scratch/ci-evidence/python-version.txt
            scratch/ci-evidence/pip-freeze.txt
          if-no-files-found: error
          retention-days: 30
